<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Data</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">

        <!-- Form Section -->
        <div class="form-container">

            <h1>Add Student Data</h1>

            <form id="studentForm">

                <!-- Student ID -->
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input
                        type="number"
                        id="studentId"
                        placeholder="Enter student ID"
                    >
                </div>

                <!-- Student Name -->
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                    >
                </div>

                <!-- Maths -->
                <div class="form-group">
                    <label for="mathsMarks">Maths Marks</label>
                    <input
                        type="number"
                        id="mathsMarks"
                        placeholder="Enter maths marks"
                    >
                </div>

                <!-- Science -->
                <div class="form-group">
                    <label for="scienceMarks">Science Marks</label>
                    <input
                        type="number"
                        id="scienceMarks"
                        placeholder="Enter science marks"
                    >
                </div>

                <!-- English -->
                <div class="form-group">
                    <label for="englishMarks">English Marks</label>
                    <input
                        type="number"
                        id="englishMarks"
                        placeholder="Enter English marks"
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" id="addStudentBtn">
                    Add Student
                </button>

            </form>

        </div>


        <!-- Table Section -->
        <div class="table-container">

            <h2>Student Data</h2>

            <table id="studentTable">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Maths</th>
                        <th>Science</th>
                        <th>English</th>
                        <th class="editbtn">EDIT </th>
                        <th class = "deletebtn">DELETE</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">

                    <!-- JavaScript will add students here -->

                </tbody>

            </table>

        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
